<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8edf4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Plan Pastel"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Plan Pastel</title><style>
:root{--bg:#fbf7f4;--ink:#393340;--muted:#827a87;--pink:#f5dce4;--lilac:#e7def5;--mint:#dcefe3;--peach:#fae4d5;--yellow:#f8efc9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding-bottom:85px}.top{padding:28px 20px;background:linear-gradient(135deg,#f6e2e9,#ece4f7 65%,#e3f0e7);border-radius:0 0 28px 28px}.eyebrow{font-size:12px;letter-spacing:1.5px;font-weight:800;color:#776b80}.top h1{margin:8px 0;font-size:29px}.top p,.sub{color:var(--muted);font-size:13px}.content{padding:18px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fffdf7ed;border-top:1px solid #eee6eb;padding:8px 3px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav button{border:0;background:transparent;color:#827887;flex:1;max-width:125px;padding:7px 2px;border-radius:14px;font-size:11px}.nav span{display:block;font-size:20px;margin-bottom:3px}.nav .active{background:var(--lilac);color:#514264;font-weight:700}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 12px}.head h2{font-size:22px;margin:0}.card{background:#fffdfd;border:1px solid #f0e9ed;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #65556a08}.lilac{background:var(--lilac)}.pink{background:var(--pink)}.mint{background:var(--mint)}.peach{background:var(--peach)}.yellow{background:var(--yellow)}.stats,.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;background:#6e5a7f;color:white;padding:10px 13px;border-radius:13px;font-weight:700}.soft{background:#eee5f3;color:#584967}.field{display:block;width:100%;border:1px solid #e8dfe8;background:white;border-radius:12px;padding:11px;margin:7px 0 12px;color:var(--ink)}label{font-size:13px;font-weight:650}.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}.progress{height:8px;background:#ffffffa8;border-radius:9px;overflow:hidden;margin:10px 0}.progress div{height:100%;background:#927da6}.task{display:flex;gap:10px;align-items:flex-start}.task input{width:21px;height:21px;accent-color:#8b72a0}.done .tasktitle{text-decoration:line-through;color:#9b929d}.tracker{overflow-x:auto}.tracker input{cursor:pointer}.tracker table{min-width:270px}.monthgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}.weekday{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}.dayblank{min-height:36px}.daycell{min-width:0;min-height:38px;border:1px solid #eee5ef;border-radius:9px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink);padding:2px;font-size:12px}.daycell b{font-size:12px;color:#fff}.daycell.checked{background:#bfe7d1;border-color:#8bc9a7;color:#285b40}.daycell.checked b{color:#285b40}.daycell.today{outline:2px solid #927da6;outline-offset:1px}.daycell:disabled{opacity:.45}.tasktitle{font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:5px}.empty{text-align:center;padding:20px;color:var(--muted)}.vision{border-radius:18px;padding:14px;background:white;min-height:130px}.emoji{font-size:34px}.vision h3{margin:8px 0}.modal{position:fixed;inset:0;background:#2c24364d;z-index:10;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:var(--bg);border-radius:24px 24px 0 0;padding:22px;width:100%;max-width:620px;max-height:90vh;overflow:auto}.actions{display:flex;gap:10px}.actions button{flex:1}@media(min-width:700px){.nav{position:sticky;bottom:0;border-radius:20px;margin:0 auto 20px;max-width:620px}.app{padding-bottom:0}.top{margin-top:18px;border-radius:28px}}
</style></head><body><div class="app"><header class="top"><div class="eyebrow">YOUR PERSONAL PLANNER · 2026</div><h1>Sống chất mỗi ngày ✨</h1><p>Từng bước nhỏ, tiến gần hơn đến điều bạn muốn.</p></header><main id="view" class="content"></main><nav class="nav"><button class="active" data-tab="home"><span>✦</span>Tổng quan</button><button data-tab="goals"><span>◎</span>Mục tiêu</button><button data-tab="calendar"><span>▦</span>Kế hoạch</button><button data-tab="habits"><span>❀</span>Thói quen</button><button data-tab="vision"><span>♡</span>Tầm nhìn</button></nav></div><div class="modal" id="modal"><div class="sheet"><div id="formarea"></div></div></div><script>
const KEY='planPastel_v2';
function localDate(date=new Date()){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),day=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
let d;
try { d=JSON.parse(localStorage.getItem(KEY)||'{"tasks":[],"goals":[],"habits":[],"visions":[]}'); } catch(e) { d={tasks:[],goals:[],habits:[],visions:[]}; }
d.tasks=Array.isArray(d.tasks)?d.tasks:[]; d.goals=Array.isArray(d.goals)?d.goals:[]; d.habits=Array.isArray(d.habits)?d.habits:[]; d.visions=Array.isArray(d.visions)?d.visions:[];
let tab='home',selectedDate=localDate(),trackMonth=localDate().slice(0,7);
// Tạo nội dung mẫu chỉ ở lần đầu hoàn toàn; dữ liệu đã có của người dùng không bị ghi đè.
if(!localStorage.getItem(KEY)){
 d.goals=[{id:'sample-goal-health',title:'Chăm sóc sức khỏe',category:'Sức khỏe',detail:'Vận động nhẹ 15 phút mỗi ngày',date:'2026-12-31',progress:0,color:'mint'},{id:'sample-goal-study',title:'Học tập mỗi ngày',category:'Học tập',detail:'Ôn bài hoặc đọc sách 20 phút',date:'2026-12-31',progress:0,color:'lilac'}];
 d.habits=[{id:'sample-habit-study',title:'Ôn bài / đọc sách 20 phút',emoji:'📚',days:[]},{id:'sample-habit-water',title:'Uống đủ nước',emoji:'💧',days:[]},{id:'sample-habit-move',title:'Vận động nhẹ',emoji:'🚶',days:[]}];
 d.visions=[{id:'sample-vision-study',title:'Học tập tiến bộ',caption:'Mỗi ngày hoàn thành một bước nhỏ',emoji:'📚',category:'Học tập',color:'lilac'},{id:'sample-vision-health',title:'Sống khỏe và cân bằng',caption:'Dành thời gian cho cơ thể và tinh thần',emoji:'🌿',category:'Sức khỏe',color:'mint'}];
 localStorage.setItem(KEY,JSON.stringify(d));
}const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>localDate(),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(d));render()}catch(e){alert('Không lưu được dữ liệu trên trình duyệt. Hãy kiểm tra dung lượng hoặc quyền lưu trữ của trình duyệt.');console.error(e)}},dateLabel=x=>new Date(x+'T12:00:00').toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long'}),card=(s,c='')=>`<section class="card ${c}">${s}</section>`,head=(t,s='',fn='')=>`<div class="head"><div><h2>${t}</h2><div class="sub">${s}</div></div>${fn?`<button type="button" class="btn soft" onclick="${fn.includes('(')?fn:fn+'()'}">＋ Thêm</button>`:''}</div>`,prog=n=>`<div class="progress"><div style="width:${n}%"></div></div>`,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function taskHTML(t){return card(`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="grow"><div class="tasktitle">${esc(t.title)}</div><div class="meta">${esc(t.time||'Cả ngày')} · ${esc(t.category)} · Ưu tiên ${esc(t.priority)}</div>${t.notes?`<div class="sub">${esc(t.notes)}</div>`:''}</div><button class="btn soft" onclick="remove('tasks','${t.id}')">×</button></div>`)}
function habitHTML(h){
 const [yy,mm]=trackMonth.split('-').map(Number),first=new Date(yy,mm-1,1),daysInMonth=new Date(yy,mm,0).getDate(),offset=(first.getDay()+6)%7;
 const yearCount=h.days.filter(x=>x.slice(0,4)===String(yy)).length;
 const monthCount=h.days.filter(x=>x.slice(0,7)===trackMonth).length;
 const cells=Array.from({length:offset},()=>'<span class="dayblank"></span>');
 for(let day=1;day<=daysInMonth;day++){const date=trackMonth+'-'+String(day).padStart(2,'0'),checked=h.days.includes(date),future=date>today();cells.push(`<button type="button" class="daycell ${checked?'checked':''} ${date===today()?'today':''}" ${future?'disabled':''} title="${date}" onclick="toggleHabitDate('${h.id}','${date}')"><span>${day}</span><b>${checked?'✓':''}</b></button>`)}
 return card(`<div class="row"><div class="emoji">${esc(h.emoji)}</div><div class="grow"><b>${esc(h.title)}</b><div class="sub">Tháng ${mm}/${yy}: ${monthCount}/${daysInMonth} ngày · Năm ${yy}: ${yearCount} lượt</div></div><button class="btn soft" onclick="remove('habits','${h.id}')">Xóa</button></div>
 <div class="monthgrid">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<span class="weekday">${x}</span>`).join('')}${cells.join('')}</div>
 <div class="sub" style="margin-top:8px">Chạm vào ô ngày để đánh dấu hoàn thành. Dữ liệu được giữ qua các tháng và năm.</div>`)
}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let tt=d.tasks.filter(t=>t.date===today()),done=tt.filter(t=>t.done).length,avg=d.goals.length?Math.round(d.goals.reduce((s,g)=>s+g.progress,0)/d.goals.length):0,o='';if(tab==='home'){
 let allDone=d.tasks.filter(t=>t.done).length, taskPct=d.tasks.length?Math.round(allDone/d.tasks.length*100):0;
 let habitTotal=d.habits.length, habitDone=d.habits.filter(h=>h.days.includes(today())).length;
 let month=today().slice(0,7), monthTasks=d.tasks.filter(t=>t.date&&t.date.slice(0,7)===month), monthDone=monthTasks.filter(t=>t.done).length;
 let habitChecks=d.habits.reduce((s,h)=>s+h.days.filter(x=>x.slice(0,7)===month).length,0);
 o=`<div class="sub">${dateLabel(today())}</div>${card(`<div class="eyebrow">TỔNG QUAN HÔM NAY</div><h2>Mỗi ngày một chút 🌷</h2><div class="sub">${d.goals.length} mục tiêu · ${d.habits.length} thói quen đang theo dõi</div>${prog(avg)}Tiến độ mục tiêu: <b>${avg}%</b>`,'lilac')}
 <div class="stats">${card(`<div>☑️ Công việc hôm nay</div><h1>${done}/${tt.length}</h1><div class="sub">đã hoàn thành</div>${prog(tt.length?done/tt.length*100:0)}`,'mint')}${card(`<div>🌱 Thói quen hôm nay</div><h1>${habitDone}/${habitTotal}</h1><div class="sub">đã tick hoàn thành</div>${prog(habitTotal?habitDone/habitTotal*100:0)}`,'peach')}${card(`<div>📌 Tất cả công việc</div><h1>${taskPct}%</h1><div class="sub">${allDone}/${d.tasks.length} việc đã xong</div>`,'yellow')}${card(`<div>🗓️ Tổng kết tháng</div><h1>${monthDone}/${monthTasks.length}</h1><div class="sub">công việc hoàn thành · ${habitChecks} lượt thói quen đã tick</div>`,'pink')}</div>
 ${head('Việc cần làm','Tick ô vuông khi hoàn thành trong ngày','taskForm()')}${tt.length?tt.map(taskHTML).join(''):card('<div class="empty">☕ Chưa có việc hôm nay. Nhấn “＋ Thêm” để tạo việc đầu tiên.</div>')}
 ${head('Bảng tick thói quen','Đánh dấu riêng từng ngày trong 7 ngày gần nhất')}${d.habits.length?d.habits.map(habitHTML).join(''):card('<div class="empty">🌱 Chưa có thói quen. Vào mục Thói quen → ＋ Thêm để tạo, ví dụ: đọc sách, uống nước, ôn bài.</div>')}`
}
else if(tab==='goals'){o=head('Mục tiêu của mình 🎯','Chia điều muốn làm thành từng bước','goalForm')+card(`<div class="eyebrow">TIẾN ĐỘ TRUNG BÌNH</div><h1>${avg}%</h1>${prog(avg)}`,'lilac')+(d.goals.map(g=>card(`<div class="row"><div class="grow"><span class="sub">${esc(g.category)}</span><h3>${esc(g.title)}</h3><div class="sub">${esc(g.detail)} · Hạn ${esc(g.date)}</div></div><button class="btn soft" onclick="editGoal('${g.id}')">Sửa</button><button class="btn soft" onclick="remove('goals','${g.id}')">×</button></div><input type="range" min="0" max="100" value="${g.progress}" oninput="setProgress('${g.id}',this.value)" style="width:100%"><b>${g.progress}%</b>`,'lilac')).join('')||card('<div class="empty">🌈 Thêm mục tiêu đầu tiên.</div>'))}
else if(tab==='calendar'){let ts=d.tasks.filter(t=>t.date===selectedDate);o=head('Kế hoạch của mình 🗓️','Lịch theo ngày','taskForm')+card(`<label>Chọn ngày</label><input class="field" type="date" value="${selectedDate}" onchange="selectedDate=this.value;render()"><b>${dateLabel(selectedDate)}</b>`,'lilac')+(ts.map(taskHTML).join('')||card('<div class="empty">Chưa có lịch cho ngày này.</div>'))+head('Tổng quan tháng')+card(`<b>${d.tasks.filter(t=>t.date.slice(0,7)===selectedDate.slice(0,7)).length}</b> công việc trong tháng`,'mint')}
else if(tab==='habits'){
 let n=d.habits.filter(h=>h.days.includes(today())).length,monthChecks=d.habits.reduce((s,h)=>s+h.days.filter(x=>x.slice(0,7)===trackMonth).length,0),yearChecks=d.habits.reduce((s,h)=>s+h.days.filter(x=>x.slice(0,4)===trackMonth.slice(0,4)).length,0);
 o=head('Thói quen tích cực 🌱','Nhắc mình mỗi ngày · tick lịch khi hoàn thành','habitForm')+
 card(`<div class="eyebrow">TỔNG HỢP</div><h2>Hôm nay: ${n}/${d.habits.length} thói quen</h2>${prog(d.habits.length?n/d.habits.length*100:0)}<div class="sub">Tháng ${trackMonth}: ${monthChecks} lượt hoàn thành · Năm ${trackMonth.slice(0,4)}: ${yearChecks} lượt hoàn thành · Lịch sử nhiều năm được lưu theo ngày.</div>`,'mint')+
 card(`<div class="row"><button class="btn soft" onclick="shiftMonth(-1)">‹ Tháng trước</button><div class="grow" style="text-align:center"><b>${new Date(trackMonth+'-15T12:00:00').toLocaleDateString('vi-VN',{month:'long',year:'numeric'})}</b></div><button class="btn soft" onclick="shiftMonth(1)">Tháng sau ›</button></div><div class="sub" style="text-align:center;margin-top:6px">Mỗi ô là một ngày trong tháng</div>`,'lilac')+
 (d.habits.map(habitHTML).join('')||card('<div class="empty">Chưa có thói quen. Nhấn ＋ Thêm để tạo việc nhắc hằng ngày, ví dụ: ôn bài, uống nước, vận động.</div>','yellow'))
}
else{o=head('Bảng tầm nhìn 💗','Mơ lớn. Bắt đầu nhỏ. Kiên trì.','visionForm')+card('<div class="eyebrow">MY 2026 VISION BOARD</div><h2>Hình dung cuộc sống bạn muốn xây dựng</h2>','pink')+`<div class="grid">${d.visions.map(v=>`<article class="vision ${v.color}"><div class="emoji">${esc(v.emoji)}</div><h3>${esc(v.title)}</h3><p>${esc(v.caption)}</p><div class="sub">${esc(v.category)}</div><button class="btn soft" onclick="remove('visions','${v.id}')">Xóa</button></article>`).join('')}</div>`+(!d.visions.length?card('<div class="empty">✨ Tạo bảng tầm nhìn đầu tiên.</div>'):'')};$('#view').innerHTML=o}
function form(title,fields,cb){$('#formarea').innerHTML=`<h2>${title}</h2><form id="f">${fields}<div class="actions"><button type="button" class="btn soft" onclick="closeForm()">Hủy</button><button class="btn">Lưu</button></div></form>`;$('#modal').classList.add('open');$('#f').onsubmit=e=>{e.preventDefault();try{cb(Object.fromEntries(new FormData(e.target)));closeForm();save()}catch(err){alert('Chưa lưu được nội dung. Vui lòng kiểm tra các ô bắt buộc rồi thử lại.');console.error(err)}}}function closeForm(){$('#modal').classList.remove('open')}function inp(n,l,p='',type='text',v=''){return `<label>${l}</label><input class="field" name="${n}" type="${type}" placeholder="${p}" value="${esc(v)}" ${n==='title'?'required':''}>`}function selectField(n,l,a){return `<label>${l}</label><select class="field" name="${n}">${a.map(x=>`<option>${x}</option>`).join('')}</select>`}
function taskForm(){form('Thêm công việc',inp('title','Tên công việc','Ví dụ: đọc sách')+inp('date','Ngày','','date',selectedDate)+inp('time','Giờ','09:00','time')+selectField('category','Danh mục',['Cá nhân','Công việc','Gia đình','Học tập','Sức khỏe','Tài chính'])+selectField('priority','Ưu tiên',['Thấp','Vừa','Cao'])+inp('notes','Ghi chú',''),v=>d.tasks.push({id:uid(),...v,done:false}))}function goalForm(){form('Mục tiêu mới',inp('title','Tên mục tiêu','')+selectField('category','Lĩnh vực',['Cuộc sống','Tài chính','Công việc','Sức khỏe','Học tập','Gia đình'])+inp('detail','Bước đầu tiên','')+inp('date','Ngày mục tiêu','','date','2026-12-31'),v=>d.goals.push({id:uid(),...v,progress:0,color:['lilac','pink','mint','peach','yellow'][d.goals.length%5]}))}function habitForm(){form('Thói quen mới',inp('title','Tên thói quen','Ví dụ: đọc 10 trang')+selectField('emoji','Biểu tượng',['🌱','📚','💧','🧘','🚶','💰','🎨','🌙','📝','🏃']),v=>d.habits.push({id:uid(),title:v.title,emoji:v.emoji,days:[]}))}function visionForm(){form('Thêm vào tầm nhìn',inp('title','Tiêu đề','')+inp('caption','Mô tả','')+selectField('emoji','Biểu tượng',['✨','🏡','💰','🌿','📚','✈️','💗','🎓','🏃','🎨','🌸','🌈'])+selectField('category','Chủ đề',['Ước mơ','Tài chính','Sức khỏe','Công việc','Học tập','Gia đình','Du lịch']),v=>d.visions.push({id:uid(),...v,color:['lilac','pink','mint','peach','yellow'][d.visions.length%5]}))}function editGoal(i){const g=d.goals.find(x=>x.id===i);if(!g)return;form('Sửa mục tiêu',inp('title','Tên mục tiêu','', 'text',g.title)+selectField('category','Lĩnh vực',['Cuộc sống','Tài chính','Công việc','Sức khỏe','Học tập','Gia đình'])+inp('detail','Bước tiếp theo','', 'text',g.detail)+inp('date','Ngày mục tiêu','','date',g.date),v=>Object.assign(g,v));const f=$('#f');if(f){const c=f.elements.category;if(c)c.value=g.category}}
function shiftMonth(delta){let [y,m]=trackMonth.split('-').map(Number),dt=new Date(y,m-1+delta,1);trackMonth=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');render()}function toggleTask(i){let x=d.tasks.find(t=>t.id===i);if(x)x.done=!x.done;save()}function toggleHabit(i){toggleHabitDate(i,today())}
function toggleHabitDate(i,date){let h=d.habits.find(x=>x.id===i);if(!h)return;h.days=h.days.includes(date)?h.days.filter(x=>x!==date):[...h.days,date];save()}function remove(k,i){if(confirm('Bạn có chắc muốn xóa mục này?')){d[k]=d[k].filter(x=>x.id!==i);save()}}function setProgress(i,v){let g=d.goals.find(x=>x.id===i);if(g){g.progress=+v;localStorage.setItem(KEY,JSON.stringify(d));}}// Gắn rõ các hàm vào window để các nút onclick trong giao diện luôn gọi được.
window.taskForm=taskForm; window.goalForm=goalForm; window.habitForm=habitForm; window.visionForm=visionForm;
window.toggleTask=toggleTask; window.toggleHabit=toggleHabit; window.toggleHabitDate=toggleHabitDate;
window.remove=remove; window.setProgress=setProgress; window.editGoal=editGoal; window.closeForm=closeForm;
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#modal').onclick=e=>{if(e.target.id==='modal')closeForm()};render();
</script></body></html>
