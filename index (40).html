<script>
const KEY='planPastel_v2';
function localDate(date=new Date()){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),day=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
let d;
try { d=JSON.parse(localStorage.getItem(KEY)||'{"tasks":[],"goals":[],"habits":[],"visions":[]}'); } catch(e) { d={tasks:[],habits:[],visions:[],finance:[]}; }
d.tasks=Array.isArray(d.tasks)?d.tasks:[]; d.habits=Array.isArray(d.habits)?d.habits:[]; d.visions=Array.isArray(d.visions)?d.visions:[]; d.finance=Array.isArray(d.finance)?d.finance:[]; d.diary=Array.isArray(d.diary)?d.diary:[]; d.notes=Array.isArray(d.notes)?d.notes:[];
let tab='home',selectedDate=localDate(),trackMonth=localDate().slice(0,7),financeMonth=localDate().slice(0,7);
// Tạo nội dung mẫu chỉ ở lần đầu hoàn toàn; dữ liệu đã có của người dùng không bị ghi đè.
if(!localStorage.getItem(KEY)){
 d.habits=[{id:'sample-habit-study',title:'Ôn bài / đọc sách 20 phút',emoji:'📚',days:[]},{id:'sample-habit-water',title:'Uống đủ nước',emoji:'💧',days:[]},{id:'sample-habit-move',title:'Vận động nhẹ',emoji:'🚶',days:[]}];
 d.visions=[{id:'sample-vision-study',title:'Học tập tiến bộ',caption:'Mỗi ngày hoàn thành một bước nhỏ',emoji:'📚',category:'Học tập',color:'lilac'},{id:'sample-vision-health',title:'Sống khỏe và cân bằng',caption:'Dành thời gian cho cơ thể và tinh thần',emoji:'🌿',category:'Sức khỏe',color:'mint'}];
 localStorage.setItem(KEY,JSON.stringify(d));
}const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>localDate(),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(d));render()}catch(e){alert('Không lưu được dữ liệu trên trình duyệt. Hãy kiểm tra dung lượng hoặc quyền lưu trữ của trình duyệt.');console.error(e)}},dateLabel=x=>new Date(x+'T12:00:00').toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long'}),card=(s,c='')=>`<section class="card ${c}">${s}</section>`,head=(t,s='',fn='')=>`<div class="head"><div><h2>${t}</h2><div class="sub">${s}</div></div>${fn?`<button type="button" class="btn soft" onclick="${fn.includes('(')?fn:fn+'()'}">＋ Thêm</button>`:''}</div>`,prog=n=>`<div class="progress"><div style="width:${n}%"></div></div>`,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function taskHTML(t){return card(`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="grow"><div class="tasktitle">${esc(t.title)}</div><div class="meta">${esc(t.time||'Cả ngày')} · ${esc(t.category)} · Ưu tiên ${esc(t.priority)}</div>${t.notes?`<div class="sub">${esc(t.notes)}</div>`:''}</div><button class="btn soft" onclick="remove('tasks','${t.id}')">×</button></div>`)}
function habitHTML(h){
 const [yy,mm]=trackMonth.split('-').map(Number),first=new Date(yy,mm-1,1),daysInMonth=new Date(yy,mm,0).getDate(),offset=(first.getDay()+6)%7;
 const yearCount=h.days.filter(x=>x.slice(0,4)===String(yy)).length;
 const monthCount=h.days.filter(x=>x.slice(0,7)===trackMonth).length;
 const cells=Array.from({length:offset},()=>'<span class="dayblank"></span>');
 for(let day=1;day<=daysInMonth;day++){const date=trackMonth+'-'+String(day).padStart(2,'0'),checked=h.days.includes(date),future=date>today();cells.push(`<button type="button" class="daycell ${checked?'checked':''} ${date===today()?'today':''}" ${future?'disabled':''} title="${date}" onclick="toggleHabitDate('${h.id}','${date}')"><span>${day}</span><b>${checked?'✓':''}</b></button>`)}
 return card(`<div class="row"><div class="emoji">${esc(h.emoji)}</div><div class="grow"><b>${esc(h.title)}</b><div class="sub">Tháng ${mm}/${yy}: ${monthCount}/${daysInMonth} ngày · Năm ${yy}: ${yearCount} lượt</div></div><button class="btn soft" onclick="remove('habits','${h.id}')">Xóa</button></div>
 <div class="monthgrid">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<span class="weekday">${x}</span>`).join('')}${cells.join('')}</div>
 <div class="sub" style="margin-top:8px">Chạm vào ô ngày để đánh dấu hoàn thành. Dữ liệu được giữ qua các tháng và năm.</div>`)
}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let tt=d.tasks.filter(t=>t.date===today()),done=tt.filter(t=>t.done).length,o='';if(tab==='home'){
 let allDone=d.tasks.filter(t=>t.done).length, taskPct=d.tasks.length?Math.round(allDone/d.tasks.length*100):0;
 let habitTotal=d.habits.length, habitDone=d.habits.filter(h=>h.days.includes(today())).length;
 let month=today().slice(0,7), monthTasks=d.tasks.filter(t=>t.date&&t.date.slice(0,7)===month), monthDone=monthTasks.filter(t=>t.done).length;
 let financeMonthRecords=d.finance.filter(x=>!x.isRecurringTemplate&&x.date&&x.date.slice(0,7)===month), homeIncome=financeMonthRecords.filter(x=>x.type==='Thu').reduce((s,x)=>s+Number(x.amount||0),0), homeExpense=financeMonthRecords.filter(x=>x.type==='Chi').reduce((s,x)=>s+Number(x.amount||0),0), homeFmt=n=>Number(n||0).toLocaleString('vi-VN',{maximumFractionDigits:0})+' ₫';
 let habitChecks=d.habits.reduce((s,h)=>s+h.days.filter(x=>x.slice(0,7)===month).length,0);
 o=`<div class="sub">${dateLabel(today())}</div>`+card(`<div class="eyebrow">TỔNG QUAN HÔM NAY</div><h2>Mỗi ngày một chút 🌷</h2><div class="sub">Một bước nhỏ hôm nay cũng đáng quý</div>`,'lilac')+
 `<div class="stats">${card(`<div>☑️ Công việc</div><h1>${done}/${tt.length}</h1>${prog(tt.length?done/tt.length*100:0)}`,'mint')}${card(`<div>🌱 Thói quen </div><h1>${habitDone}/${habitTotal}</h1>${prog(habitTotal?habitDone/habitTotal*100:0)}`,'peach')}${card(`<div>💰 Còn lại</div><h2 class="money">${homeFmt(homeIncome-homeExpense)}</h2>`,'yellow')}${card(`<div>🗓️ Tổng kết tháng</div><h1>${monthDone}/${monthTasks.length}</h1>`,'pink')}</div>`+
 head('Việc cần làm hôm nay')+(tt.length?tt.map(taskHTML).join(''):card('<div class="empty">☕ Hôm nay chưa có công việc nào.</div>'))+head('Thói quen hôm nay')+(d.habits.length?d.habits.map(h=>card(`<div class="task"><input type="checkbox" ${h.days.includes(today())?'checked':''} onchange="toggleHabitDate('${h.id}','${today()}')"><div class="grow"><div class="tasktitle">${esc(h.emoji||'🌱')} ${esc(h.title)}</div></div></div>`,'mint')).join(''):card('<div class="empty">Chưa có thói quen. Hãy tạo trong mục Thói quen.</div>'));

}
else if(tab==='calendar'){let ts=d.tasks.filter(t=>t.date===selectedDate);o=head('Kế hoạch của mình 🗓️','Lịch theo ngày','taskForm')+card(`<label>Chọn ngày</label><input class="field" type="date" value="${selectedDate}" onchange="selectedDate=this.value;render()"><b>${dateLabel(selectedDate)}</b>`,'lilac')+(ts.map(taskHTML).join('')||card('<div class="empty">Chưa có lịch cho ngày này.</div>'))+head('Tổng quan tháng')+card(`<b>${d.tasks.filter(t=>t.date.slice(0,7)===selectedDate.slice(0,7)).length}</b> công việc trong tháng`,'mint')}
else if(tab==='habits'){
 let n=d.habits.filter(h=>h.days.includes(today())).length,monthChecks=d.habits.reduce((s,h)=>s+h.days.filter(x=>x.slice(0,7)===trackMonth).length,0),yearChecks=d.habits.reduce((s,h)=>s+h.days.filter(x=>x.slice(0,4)===trackMonth.slice(0,4)).length,0);
 o=head('Thói quen tích cực 🌱','Nhắc mình mỗi ngày · tick lịch khi hoàn thành','habitForm')+
 card(`<div class="eyebrow">TỔNG HỢP</div><h2>Hôm nay: ${n}/${d.habits.length} thói quen</h2>${prog(d.habits.length?n/d.habits.length*100:0)}<div class="sub">Tháng ${trackMonth}: ${monthChecks} lượt hoàn thành · Năm ${trackMonth.slice(0,4)}: ${yearChecks} lượt hoàn thành · Lịch sử nhiều năm được lưu theo ngày.</div>`,'mint')+
 card(`<div class="row"><button class="btn soft" onclick="shiftMonth(-1)">‹ Tháng trước</button><div class="grow" style="text-align:center"><b>${new Date(trackMonth+'-15T12:00:00').toLocaleDateString('vi-VN',{month:'long',year:'numeric'})}</b></div><button class="btn soft" onclick="shiftMonth(1)">Tháng sau ›</button></div><div class="sub" style="text-align:center;margin-top:6px">Mỗi ô là một ngày trong tháng</div>`,'lilac')+
 (d.habits.map(habitHTML).join('')||card('<div class="empty">Chưa có thói quen. Nhấn ＋ Thêm để tạo việc nhắc hằng ngày, ví dụ: ôn bài, uống nước, vận động.</div>','yellow'))
}
else if(tab==='finance'){
 let month=financeMonth||today().slice(0,7),year=month.slice(0,4);

const firebaseConfig = {
  apiKey: "AIzaSyAUPhY4RuiR-ZnTDUSRUXfF4-QhhTZzN0U",
  authDomain: "nexa-9a4a3.firebaseapp.com",
  projectId: "nexa-9a4a3",
  storageBucket: "nexa-9a4a3.firebasestorage.app",
  messagingSenderId: "121760673377",
  appId: "1:121760673377:web:e3d494ba9eb957748c4420",
  measurementId: "G-DCEFF1MC9M"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence).catch(err => showAuthStatus('Không bật được ghi nhớ đăng nhập: ' + friendlyError(err)));
isSupported().then(ok => { if (ok) getAnalytics(app); }).catch(() => {});
const provider = new GoogleAuthProvider();
function showAuthStatus(message){const el=document.getElementById('authStatus');if(el)el.textContent=message;}
function friendlyError(err){const code=err?.code||'';const map={
 'auth/operation-not-allowed':'Bạn cần bật Google trong Firebase Console → Authentication → Sign-in method → Google. Lưu ý nhấn Save sau khi bật.',
 'auth/popup-blocked':'Trình duyệt đã chặn cửa sổ Google. Hãy cho phép cửa sổ bật lên rồi thử lại.',
 'auth/unauthorized-domain':'Tên miền hiện tại chưa được thêm vào Firebase Authentication → Settings → Authorized domains.'
};return map[code]||('Có lỗi: '+(err?.message||code||'vui lòng thử lại.'));}
window.nexaGoogleLogin=async()=>{showAuthStatus('Đang mở đăng nhập Google…');try{await setPersistence(auth,browserLocalPersistence);await signInWithPopup(auth,provider);showAuthStatus('Đăng nhập Google thành công.');}catch(e){showAuthStatus(friendlyError(e));}};
window.nexaSignOut=async()=>{try{await signOut(auth);showAuthStatus('Đã đăng xuất.');}catch(e){showAuthStatus(friendlyError(e));}};
onAuthStateChanged(auth,user=>{const signed=document.getElementById('authSignedIn'),emailLine=document.getElementById('signedEmail'),out=document.getElementById('authSignOut'),button=document.querySelector('.login-btn');if(user){if(signed)signed.textContent='Đang đăng nhập: '+(user.email||user.displayName||'Tài khoản Google');if(emailLine)emailLine.textContent=user.email||'';if(out)out.style.display='block';if(button){button.textContent='Gmail';button.title=user.email||'';}}else{if(signed)signed.textContent='Chưa đăng nhập.';if(emailLine)emailLine.textContent='';if(out)out.style.display='none';if(button){button.textContent='Gmail';button.title='Đăng nhập bằng Google';}}});
</script>
</body></html>
